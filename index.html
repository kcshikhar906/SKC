<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shikhar KC - Business Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .business-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .business-card:hover {
            transform: translateY(-5px);
        }

        .business-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            50% { transform: translateX(100%) translateY(100%) rotate(45deg); }
            100% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
        }

        .profile-section {
            position: relative;
            z-index: 2;
            margin-bottom: 30px;
        }

        .profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            overflow: hidden;
            position: relative;
            transition: transform 0.3s ease;
        }

        .profile-image:hover {
            transform: scale(1.05);
        }

        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .name {
            font-size: 2.2em;
            font-weight: 700;
            color: white;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .title {
            font-size: 1.2em;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 10px;
            font-weight: 300;
        }

        .description {
            font-size: 1em;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .contact-info {
            margin-bottom: 30px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95em;
        }

        .contact-item svg {
            width: 16px;
            height: 16px;
            margin-right: 10px;
            fill: currentColor;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .social-link:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .social-link svg {
            width: 24px;
            height: 24px;
        }

        .download-vcard {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 0 auto;
            text-decoration: none;
        }

        .download-vcard:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, #5a67d8, #6b46c1);
        }

        .download-vcard svg {
            width: 20px;
            height: 20px;
        }

        @media (max-width: 600px) {
            .business-card {
                padding: 30px 20px;
                margin: 10px;
            }
            
            .name {
                font-size: 1.8em;
            }
            
            .social-links {
                gap: 10px;
            }
            
            .social-link {
                width: 45px;
                height: 45px;
            }
        }
    </style>
</head>

    <script>
        // Personal information object (customize this with your details)
        const personalInfo = {
            fullName: "Shikhar KC",
            jobTitle: "IT Support Specialist",
            bio: "Passionate developer creating innovative solutions with modern technologies. Let's build something amazing together!",
            email: "contact@shikharkc.com.np",
            phone: "+61 452476782",
            location: "Sydney, Australia",
            profileImage: "https://shikharkc.com.np/images/shikhar.jpg",
            links: {
                github: "https://github.com/kcshikhar906",
                linkedin: "https://www.linkedin.com/in/shikharkc184/",
                youtube: "https://www.youtube.com/@ShikharKC",
                portfolio: "https://shikharkc.com.np/",
                // twitter: "https://twitter.com/johndoe",
                instagram: "https://www.instagram.com/kcshikhar/#"
            }
        };

        // Update the page with personal information
        function updateProfile() {
            document.getElementById('fullName').textContent = personalInfo.fullName;
            document.getElementById('jobTitle').textContent = personalInfo.jobTitle;
            document.getElementById('bio').textContent = personalInfo.bio;
            document.getElementById('email').textContent = personalInfo.email;
            document.getElementById('phone').textContent = personalInfo.phone;
            document.getElementById('location').textContent = personalInfo.location;
            document.getElementById('profileImg').src = personalInfo.profileImage;
            
            // Update social links
            document.getElementById('githubLink').href = personalInfo.links.github;
            document.getElementById('linkedinLink').href = personalInfo.links.linkedin;
            document.getElementById('youtubeLink').href = personalInfo.links.youtube;
            document.getElementById('portfolioLink').href = personalInfo.links.portfolio;
            document.getElementById('twitterLink').href = personalInfo.links.twitter;
            document.getElementById('instagramLink').href = personalInfo.links.instagram;
        }

        // Generate and download vCard
        function downloadVCard() {
            const vCardData = `BEGIN:VCARD
VERSION:3.0
FN:${personalInfo.fullName}
TITLE:${personalInfo.jobTitle}
EMAIL:${personalInfo.email}
TEL:${personalInfo.phone}
ADR:;;${personalInfo.location};;;;
NOTE:${personalInfo.bio}
URL:${personalInfo.links.portfolio}
END:VCARD`;

            const blob = new Blob([vCardData], { type: 'text/vcard' });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            
            link.href = url;
            link.download = `${personalInfo.fullName.replace(/\s+/g, '_')}.vcf`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(url);
        }

        // Initialize the profile on page load
        updateProfile();

        // Add click tracking for social links
        document.querySelectorAll('.social-link').forEach(link => {
            link.addEventListener('click', function(e) {
                console.log(`Clicked: ${this.title}`);
            });
        });
    </script>
