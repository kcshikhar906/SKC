<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Business Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .business-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 0;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
            display: grid;
            grid-template-columns: 200px 1fr;
            min-height: 500px;
        }

        .business-card:hover {
            transform: translateY(-5px);
        }

        .business-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            50% { transform: translateX(100%) translateY(100%) rotate(45deg); }
            100% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
        }

        .left-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            position: relative;
        }

        .left-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent, rgba(102, 126, 234, 0.1), transparent);
            animation: shimmer 4s infinite;
        }

        @keyframes shimmer {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        .profile-section {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .profile-image {
            width: 140px;
            height: 140px;
            border-radius: 30px;
            margin-bottom: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            overflow: hidden;
            position: relative;
            transition: all 0.4s ease;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .profile-image:hover {
            transform: scale(1.05) rotate(2deg);
            border-radius: 50%;
        }

        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .profile-image:hover img {
            transform: scale(1.1);
        }

        .right-panel {
            padding: 40px 35px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            z-index: 2;
        }

        .header-section {
            margin-bottom: 25px;
        }

        .name {
            font-size: 2.4em;
            font-weight: 800;
            color: white;
            margin-bottom: 8px;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
            line-height: 1.1;
        }

        .title {
            font-size: 1.1em;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 15px;
            font-weight: 400;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 600;
        }

        .description {
            font-size: 0.95em;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.6;
            margin-bottom: 25px;
            font-style: italic;
        }

        .contact-info {
            margin-bottom: 25px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.85em;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .contact-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .contact-item svg {
            width: 14px;
            height: 14px;
            margin-right: 8px;
            fill: currentColor;
            opacity: 0.8;
        }

        .email-highlight {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
            border: 1px solid rgba(102, 126, 234, 0.3);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .social-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .social-link:hover::before {
            left: 100%;
        }

        .social-link:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px) scale(1.1);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .social-link svg {
            width: 22px;
            height: 22px;
            z-index: 1;
        }

        .download-vcard {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 25px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 0 auto;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .download-vcard::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s ease;
        }

        .download-vcard:hover::before {
            left: 100%;
        }

        .download-vcard:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, #5a67d8, #6b46c1);
        }

        .download-vcard svg {
            width: 18px;
            height: 18px;
        }

        @media (max-width: 700px) {
            .business-card {
                grid-template-columns: 1fr;
                max-width: 400px;
                min-height: auto;
            }
            
            .left-panel {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.2);
                padding: 25px 20px;
            }
            
            .profile-image {
                width: 120px;
                height: 120px;
            }
            
            .right-panel {
                padding: 30px 25px;
            }
            
            .name {
                font-size: 2em;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
            }
            
            .social-links {
                gap: 10px;
            }
            
            .social-link {
                width: 42px;
                height: 42px;
            }
        }
    </style>
</head>

    <script>

        const personalInfo = {

            phone: "+61 452476782",
            location: "Sydney, Australia",
            experience: "2+ Years Experience",
            specialization: "AI-Powered Support Solutions",
            certifications: "Google IT Support, Azure AI Fundamentals",
            profileImage: "https://shikharkc.com.np/images/shikhar.jpg",
            links: {
                github: "https://github.com/kcshikhar906",
                linkedin: "https://www.linkedin.com/in/shikharkc184/",
                youtube: "https://www.youtube.com/@ShikharKC",
                portfolio: "https://shikharkc.com.np/",
                instagram: "https://www.instagram.com/kcshikhar/#",
                whatsapp: "+61452476782",
                email_direct: "contact@shikharkc.com.np"
            }
        };

        // Update the page with personal information
        function updateProfile() {
            document.getElementById('fullName').textContent = personalInfo.fullName;
            document.getElementById('jobTitle').textContent = personalInfo.jobTitle;
            document.getElementById('bio').textContent = personalInfo.bio;
            document.getElementById('email').textContent = personalInfo.email;
            document.getElementById('experience').textContent = personalInfo.experience;
            document.getElementById('specialization').textContent = personalInfo.specialization;
            document.getElementById('certifications').textContent = personalInfo.certifications;
            document.getElementById('location').textContent = personalInfo.location;
            document.getElementById('profileImg').src = personalInfo.profileImage;
            
            // Update social links
            document.getElementById('githubLink').href = personalInfo.links.github;
            document.getElementById('linkedinLink').href = personalInfo.links.linkedin;
            document.getElementById('youtubeLink').href = personalInfo.links.youtube;
            document.getElementById('portfolioLink').href = personalInfo.links.portfolio;
            document.getElementById('whatsappLink').href = `https://wa.me/${personalInfo.links.whatsapp.replace(/[^0-9]/g, '')}`;
            document.getElementById('emailDirectLink').href = `mailto:${personalInfo.links.email_direct}?subject=IT Support Inquiry&body=Hi ${personalInfo.fullName.split(' ')[0]}, I need help with...`;
            document.getElementById('instagramLink').href = personalInfo.links.instagram;
        }

        // Generate and download vCard
        function downloadVCard() {
            const vCardData = `BEGIN:VCARD
VERSION:3.0
FN:${personalInfo.fullName}
TITLE:${personalInfo.jobTitle}
EMAIL:${personalInfo.email}
TEL:${personalInfo.phone}
ADR:;;${personalInfo.location};;;;
NOTE:${personalInfo.bio}
URL:${personalInfo.links.portfolio}
END:VCARD`;

            const blob = new Blob([vCardData], { type: 'text/vcard' });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            
            link.href = url;
            link.download = `${personalInfo.fullName.replace(/\s+/g, '_')}.vcf`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(url);
        }

        // Initialize the profile on page load
        updateProfile();

        // Add click tracking for social links
        document.querySelectorAll('.social-link').forEach(link => {
            link.addEventListener('click', function(e) {
                console.log(`Clicked: ${this.title}`);
            });
        });
    </script>
